
<div class="notifications-page">

  <!-- BACK BUTTON -->
  <button
    type="button"
    class="page-back-arrow"
    (click)="goBack($event)">
    ←
  </button>

  <!-- HEADER -->
  <div class="notifications-header">

    <h2>Notifications</h2>

    <button
      type="button"
      class="mark-read-btn"
      (click)="markAllRead()"
      *ngIf="notifications().length > 0">
      Mark all as read
    </button>

  </div>

  <!-- LOADING -->
  <div
    class="loading-state"
    *ngIf="isLoading()">

    Loading notifications...

  </div>

  <!-- EMPTY NOTIFICATIONS -->
  <div
    class="empty-state"
    *ngIf="!isLoading() && notifications().length === 0">

    <div class="empty-icon">
      <i class="fa-regular fa-bell"></i>
    </div>

    <h3>No notifications yet</h3>

    <p>
      You're all caught up! When you receive updates
      about your posts, messages, or account activity,
      they'll appear here.
    </p>

  </div>

  <!-- NOTIFICATION LIST -->
  <div
    class="notifications-list"
    *ngIf="!isLoading() && notifications().length > 0">

    <div
      class="notification-card"
      *ngFor="let n of notifications()"
      [class.unread]="!n.isread"
      (click)="markAsRead(n)">

      <div class="icon">
        {{ n.icon }}
      </div>

      <div class="content">

        <h4>{{ n.title }}</h4>

        <p>{{ n.message }}</p>

        <span class="time">
          {{ n.time }}
        </span>

      </div>

      <span
        class="dot"
        *ngIf="!n.isread">
      </span>

    </div>

  </div>

</div>
